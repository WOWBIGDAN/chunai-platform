name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chunai-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-root-password
          MYSQL_DATABASE: chunai_auth_test
          MYSQL_USER: chunai_test
          MYSQL_PASSWORD: ci-only-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=3s --health-retries=30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Test real MySQL transactions and HTTP APIs
        run: npm run test:e2e
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: '3306'
          TEST_DB_USER: chunai_test
          TEST_DB_PASSWORD: ci-only-test-password
          TEST_DB_NAME: chunai_auth_test
      - run: npm run build
      - name: Validate generated API contracts
        run: |
          python3 scripts/build_api_docs.py
          git diff --exit-code -- docs/01-api-reference.md docs/02-data-models.md docs/openapi.json docs/openapi-auth.json
      - name: Package Linux application and production dependencies
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: bash scripts/package-release.sh "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: release-${{ github.sha }}
          path: .release/release.tar.gz
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
          include-hidden-files: true

  deploy:
    needs: verify-build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: http://47.97.46.242
    concurrency:
      group: chunai-staging-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ github.sha }}
          path: release
      - name: Upload and activate the tested revision
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER"
          install -m 0700 -d "$RUNNER_TEMP/chunai-ssh"
          key="$RUNNER_TEMP/chunai-ssh/id_ed25519"
          hosts="$RUNNER_TEMP/chunai-ssh/known_hosts"
          trap 'rm -f -- "$key" "$hosts"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$hosts"
          chmod 0600 "$key" "$hosts"
          options=(-i "$key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          checksum=$(sha256sum release/release.tar.gz | cut -d ' ' -f 1)
          scp "${options[@]}" release/release.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/opt/chunai/incoming/$GITHUB_SHA.tar.gz"
          ssh "${options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "sudo /usr/local/sbin/chunai-release '$GITHUB_SHA' '$checksum'"
      - name: Verify the public health endpoint
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 http://47.97.46.242/api/v1/health \
            | python3 -c 'import json,sys; assert json.load(sys.stdin)["data"]["status"] == "ok"'
